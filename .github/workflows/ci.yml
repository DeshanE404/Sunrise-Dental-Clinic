name: Java CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  build:
    name: Test and package WAR
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify, test, and package
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Confirm WAR artifact
        shell: bash
        run: |
          war_count=$(find target -maxdepth 1 -type f -name '*.war' | wc -l)
          if [ "$war_count" -ne 1 ]; then
            echo "Expected exactly one WAR in target, found $war_count"
            exit 1
          fi
          find target -maxdepth 1 -type f -name '*.war' -print

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-dental-clinic-war
          path: target/*.war
          if-no-files-found: error
          retention-days: 14
